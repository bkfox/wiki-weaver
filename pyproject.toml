[project]
name = "territoires-wiki-content"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1.6",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=15.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["wiki_weaver/"]

[project.scripts]
wiki-content = "wiki_weaver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
